services:
  # === Frontend SPA (React + Nginx Alpine) ===
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.courssat.online/api/v1
    container_name: courssat-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.1'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - courssat-net

  # === Backend API (Django + Gunicorn/Uvicorn) ===
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: courssat-backend
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=api
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env.production
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/readiness/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - courssat-net

  # === Celery Default Worker (Notifications, Auth, Finance) ===
  celery-default:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: courssat-celery-default
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=celery-default
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env.production
    volumes:
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.4'
    networks:
      - courssat-net

  # === Celery Video Transcoder (FFmpeg, single concurrency) ===
  celery-video:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: courssat-celery-video
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=celery-video
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env.production
    volumes:
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    networks:
      - courssat-net

  # === Celery Beat Scheduler ===
  celery-beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: courssat-celery-beat
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=celery-beat
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env.production
    volumes:
      - media-data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.1'
    networks:
      - courssat-net

  # === PostgreSQL 16 ===
  postgres:
    image: postgres:16-alpine
    container_name: courssat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-courssat}
      - POSTGRES_USER=${DB_USER:-courssat}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-courssat} -d ${DB_NAME:-courssat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courssat-net

  # === PgBouncer Connection Pooler ===
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: courssat-pgbouncer
    restart: unless-stopped
    # Disabled for the pilot until a real SCRAM userlist is provisioned.
    # Start explicitly later with: docker compose --profile pgbouncer up -d
    profiles: ["pgbouncer"]
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: '0.2'
    networks:
      - courssat-net

  # === Redis 7.2 (Cache + Celery Broker) ===
  redis:
    image: redis:7.2-alpine
    container_name: courssat-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '0.4'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courssat-net

  # === Nginx Reverse Proxy & HLS Streaming ===
  nginx:
    image: nginx:1.27-alpine
    container_name: courssat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_SECURE_LINK_SECRET: ${NGINX_SECURE_LINK_SECRET:?NGINX_SECURE_LINK_SECRET must be set}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/generated
      NGINX_ENVSUBST_FILTER: ^NGINX_SECURE_LINK_SECRET$

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - static-data:/var/www/courssat/static:ro
      - media-data:/var/www/courssat/media:ro
      - ./infrastructure/nginx/certbot-conf:/etc/letsencrypt:ro
      - ./infrastructure/nginx/certbot-www:/var/www/certbot:ro
    tmpfs:
      - /etc/nginx/generated
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
    networks:
      - courssat-net

  # === Certbot SSL Auto-Renewal ===
  certbot:
    image: certbot/certbot:latest
    container_name: courssat-certbot
    volumes:
      - ./infrastructure/nginx/certbot-conf:/etc/letsencrypt
      - ./infrastructure/nginx/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - courssat-net

  # === Prometheus Monitoring ===
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: courssat-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
    networks:
      - courssat-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: courssat-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'
    networks:
      - courssat-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: courssat-nginx-exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx/nginx_status'
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'
    networks:
      - courssat-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: courssat-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'
    networks:
      - courssat-net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: courssat-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-courssat}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-courssat}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'
    networks:
      - courssat-net

  # === Grafana Dashboard ===
  grafana:
    image: grafana/grafana:11.1.0
    container_name: courssat-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_SERVER_ROOT_URL=https://courssat.online/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    depends_on:
      - prometheus
    networks:
      - courssat-net

volumes:
  postgres-data:
  redis-data:
  media-data:
  static-data:
  prometheus-data:
  grafana-data:

networks:
  courssat-net:
    driver: bridge
