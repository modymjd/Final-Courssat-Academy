# ====================================================================
# EduSmart Platform - SonarQube Project Configuration
# ====================================================================

sonar.projectKey=edusmart-platform
sonar.projectName=EduSmart Educational Platform
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=Backend,Frontend/src
sonar.tests=Frontend/src
sonar.test.inclusions=Frontend/src/**/*.test.ts,Frontend/src/**/*.test.tsx,Backend/**/tests/*.py

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/migrations/**,**/tmp*

# Encoding & Language Defaults
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.typescript.tsconfigPath=Frontend/tsconfig.json

# Coverage Reports Integration
sonar.python.coverage.reportPaths=Backend/coverage.xml
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
