# renew_before_expiry = 30 days
version = 2.0.0
archive_dir = /etc/letsencrypt/archive/courssat.online
cert = /etc/letsencrypt/live/courssat.online/cert.pem
privkey = /etc/letsencrypt/live/courssat.online/privkey.pem
chain = /etc/letsencrypt/live/courssat.online/chain.pem
fullchain = /etc/letsencrypt/live/courssat.online/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = your_account_id
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
