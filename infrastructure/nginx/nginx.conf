user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=hls:10m rate=100r/s;

    # Strict allow-list for browser origins. Never reflect arbitrary Origin values.
    # The frontend is served from the two canonical production web origins.
    map $http_origin $cors_allowed_origin {
        default "";
        "https://courssat.online" $http_origin;
        "https://www.courssat.online" $http_origin;
    }

    # The master playlist carries the signed query parameters. HLS clients do
    # not reliably copy that query string to child playlists/segments, so
    # subsequent requests reuse path-scoped secure cookies set after the first
    # successful request.
    map $arg_token $hls_token {
        default $arg_token;
        "" $cookie_hls_token;
    }

    map $arg_expires $hls_expires {
        default $arg_expires;
        "" $cookie_hls_expires;
    }

    # Upstream Backends
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:8080;
    }

    include /etc/nginx/generated/*.conf;
}
