; ============================================================================
; PgBouncer Configuration for Courssat Academy (courssat.online)
; Transaction-mode pooling for high concurrency (4 vCPU, 16 GB RAM)
; ============================================================================

[databases]
courssat = host=postgres port=5432 dbname=${DB_NAME:-courssat} auth_user=${DB_USER:-courssat}

[pgbouncer]
; --- Connection Limits ---
listen_addr = 0.0.0.0
listen_port = 6432
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Pool Mode ---
pool_mode = transaction

; --- Authentication ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Timeouts ---
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 120
query_wait_timeout = 30
client_login_timeout = 15

; --- Logging ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; --- Resource Limits ---
max_db_connections = 50
max_user_connections = 50

; --- Socket ---
unix_socket_dir = /tmp
admin_users = ${DB_USER:-courssat}
stats_users = ${DB_USER:-courssat}

; --- TLS ---
server_tls_sslmode = disable
