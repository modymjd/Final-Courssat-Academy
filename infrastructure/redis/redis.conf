# ============================================================================
# Redis 7.2 Configuration for Courssat Academy
# 2GB Cache + Celery Broker (allkeys-lru eviction)
# ============================================================================

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Memory
maxmemory 1536mb
# Never evict Celery broker/result keys silently. If the hard limit is reached,
# fail writes visibly so monitoring can alert instead of losing queued work.
maxmemory-policy noeviction
maxmemory-samples 10

# Celery jobs must survive a Redis/container restart.
save 900 1
save 300 10
appendonly yes
appendfsync everysec

# Logging
loglevel notice

# Performance
io-threads 2
io-threads-do-reads yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Security
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
