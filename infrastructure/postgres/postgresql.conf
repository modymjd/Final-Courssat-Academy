# ============================================================================
# PostgreSQL 16 Configuration for Courssat Academy (courssat.online)
# Optimized for: Hostinger KVM 4 (4 vCPU, 16 GB RAM, 200 GB NVMe)
# ============================================================================

# --- Connection Settings ---
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# --- Memory Configuration (tuned for 16 GB RAM) ---
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
huge_pages = try

# --- Write-Ahead Log (WAL) ---
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = zstd
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Query Planning (NVMe SSD optimized) ---
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# --- Parallelism ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Background Writer ---
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# --- Vacuum / Autovacuum ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# --- Logging ---
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms
log_line_prefix = '%m [%p] %q[user=%u,db=%d] '
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# --- Statistics ---
track_activities = on
track_counts = on
track_io_timing = on
track_wal_io_timing = on
track_functions = all

# --- Security ---
password_encryption = scram-sha-256
ssl = off

# --- Locale ---
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
timezone = 'UTC'
