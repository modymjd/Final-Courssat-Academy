        walletType:
          allOf:
          - $ref: '#/components/schemas/WalletTypeEnum'
          readOnly: true
        currency:
          type: string
          readOnly: true
        currentBalance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        pendingBalance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        availableBalance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        withdrawnBalance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - availableBalance
      - currency
      - currentBalance
      - id
      - pendingBalance
      - updatedAt
      - walletType
      - withdrawnBalance
    WalletTypeEnum:
      enum:
      - instructor
      - platform
      type: string
      description: |-
        * `instructor` - Instructor Wallet
        * `platform` - Platform Holding Wallet
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code
              example: 400
            detail:
              type: string
              description: Human-readable error summary
              example: Request validation failed
            errors:
              type: object
              nullable: true
              additionalProperties: true
              description: Field-specific error mapping if applicable
          required:
          - status
          - detail
      required:
      - error
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
