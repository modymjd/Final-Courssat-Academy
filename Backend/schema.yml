components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        maxScore:
          type: integer
          maximum: 2147483647
          minimum: 0
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - createdAt
      - id
      - title
    AssignmentRequest:
      type: object
      properties:
        course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        maxScore:
          type: integer
          maximum: 2147483647
          minimum: 0
        dueDate:
          type: string
          format: date-time
          nullable: true
      required:
      - course
      - title
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/CalendarEventTypeEnum'
        date:
          type: string
          format: date
        time:
          type: string
          format: time
          nullable: true
        course:
          type: integer
          nullable: true
        courseId:
          type: integer
          readOnly: true
        courseName:
          type: string
          readOnly: true
        description:
          type: string
      required:
      - courseId
      - courseName
      - date
      - id
      - title
      - type
    CalendarEventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/CalendarEventTypeEnum'
        date:
          type: string
          format: date
        time:
          type: string
          format: time
          nullable: true
        course:
          type: integer
          nullable: true
        description:
          type: string
      required:
      - date
      - title
      - type
    CalendarEventTypeEnum:
      enum:
      - lesson
      - assignment
      - quiz
      - live_session
      - deadline
      type: string
      description: |-
        * `lesson` - Lesson
        * `assignment` - Assignment
        * `quiz` - Quiz
        * `live_session` - Live session
        * `deadline` - Deadline
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          description: lucide-react icon name
          maxLength: 64
        color:
          type: string
          description: Tailwind bg-* class
          maxLength: 40
        courseCount:
          type: string
          readOnly: true
      required:
      - courseCount
      - id
      - name
      - slug
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          description: lucide-react icon name
          maxLength: 64
        color:
          type: string
          description: Tailwind bg-* class
          maxLength: 40
      required:
      - name
      - slug
